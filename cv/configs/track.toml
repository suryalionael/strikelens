# Settings for `strikelens-cv track` and `strikelens-cv assign`. Safe to commit.

# YOLO weights file name, looked up in models/ (gitignored). Never downloaded
# automatically. yolo11n.pt is the smallest Ultralytics model.
weights = "yolo11n.pt"

# Lowest YOLO confidence for a person box.
confidence = 0.4

# Image size YOLO resizes each frame to.
image_size = 640

# Tracks seen in fewer frames than this are ignored (passers-by, flicker).
min_track_frames = 5

# A track whose mean box is smaller than this share (0 to 1) of the biggest track
# seen in the shot (the referee included) is not a fighter: it keeps out the
# crowd behind the ropes. A fighter partly out of frame can be dropped too. On 36
# labelled boxes from a Tryout round, 0.4 left 1 wrong box (5 before) and 3
# missing (1 before). 0 turns the check off.
min_fighter_area = 0.4

# Colour distance (0 = same, 1 = nothing in common) above which a shot's match to
# the red and blue references is marked uncertain and not used to update them.
max_feature_distance = 0.5

# Kit colour. In Tryout fights the red corner wears a red singlet and blue a blue
# one, so a fighter whose chest is clearly red or blue takes that corner in every
# shot, before the shorts colour is used. Shirtless fighters show no kit and fall
# back to the shorts. Turn it off for events where the kit does not match the
# corner. A correction always beats the kit.
kit_corner = true

# Lowest gap between a fighter's red and blue kit shares (0 to 1) for the kit to
# decide. Measured on Byon footage: singlets 0.31 or more, shirtless fighters and
# the referee 0.16 or less (ADR 0006). Only needs `strikelens-cv assign` again.
min_kit_share = 0.25

# Lowest saturation (0 to 1) for a chest pixel to count as kit, so pale and grey
# pixels do not. Measured while detecting: needs `strikelens-cv track` again.
kit_min_saturation = 0.4

# Referee filter (#20). A track whose chest looks like the referee's is dropped.
# A correction always beats the filter. Changing any referee setting needs
# `strikelens-cv track` again, because the chest is measured while detecting.
referee_filter = true

# Which rule finds the referee:
# "dark": the chest is mostly black. Byon referees wear black, so this works for
#         shirtless fighters (Madness) and for fighters in singlets (Tryouts).
# "skin": the chest is mostly not skin. Only for shirtless fighters with a
#         referee in a shirt that is not black. Fighters in a top are dropped too.
referee_rule = "dark"

# Dark rule: lowest share of dark pixels on the chest for the referee (0 to 1).
min_torso_dark = 0.5

# Dark rule: a pixel is dark when its brightest channel (B, G, or R) is at most
# this (0-255) and it is not skin. Byon referees' black shirts measure up to about
# 90 under the ring lights. With 100, referees' chests were at least 60% dark and
# fighters' at most 37% (ADR 0006).
dark_max_value = 100

# Skin rule: lowest share of skin pixels on the chest for a fighter (0 to 1).
min_torso_skin = 0.25

# Skin colour ranges in YCrCb (0-255). Brightness (Y) is ignored, so the same
# range covers light and dark skin. These are the usual values from the skin
# detection literature; check them on real footage before changing.
skin_cr = [133, 173]
skin_cb = [77, 127]
