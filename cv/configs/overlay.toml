# Settings for `strikelens-cv overlay`. Safe to commit.

# Lowest MediaPipe visibility (0 to 1) for a keypoint to be drawn. A bone is drawn
# only when both of its ends pass.
min_visibility = 0.5

# Height in pixels of the strike timeline strip added below the video.
timeline_height = 48

# H.264 quality for FFmpeg's -crf, from 0 (lossless) to 51 (smallest). 18-23 looks
# good for a demo.
crf = 20

# Credit line drawn on every frame. Required before sharing a clip outside the
# team (docs/data-policy.md, Demo material).
credit = "Footage: Byon Combat. Analysis: StrikeLens"

# The stat panel (top left): round, clock, and per fighter thrown, landed, and
# accuracy, counted from confirmed tags as the video plays (same rules as the stats).
stat_panel = true

# Opacity of the panel's dark background, 0 (clear) to 1 (solid).
panel_alpha = 0.75

# How long a strike's label (for example KICK / LANDED / BODY) shows above the
# fighter after the tag's time, in milliseconds. 0 turns it off.
flash_ms = 900

# Names on the panel. Empty = RED and BLUE. `--red` and `--blue` override these.
red_name = ""
blue_name = ""
