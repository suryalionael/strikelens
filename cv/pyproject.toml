[project]
name = "strikelens-cv"
version = "0.0.1"
description = "StrikeLens computer vision pipeline: ingest, tracking, pose, strike suggestions, overlays."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Heavy dependencies are opt-in. None are installed by default or in CI.
# RTMPose (MMPose) is not listed: it installs with OpenMMLab's `mim` tool, and its
# dependency chumpy cannot be built by uv. See README and ADR 0004.
ingest = ["opencv-python>=4.10", "scenedetect>=0.6"]
detect = ["ultralytics>=8.3"]
pose = ["mediapipe>=0.10"]
train = ["torch>=2.5", "numpy>=1.26"]

[project.scripts]
strikelens-cv = "strikelens_cv.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strikelens_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
