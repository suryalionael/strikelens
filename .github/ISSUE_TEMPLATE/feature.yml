name: Feature
description: A piece of product work with clear acceptance criteria.
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: One line. What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist. Each item should be testable.
      value: |
        - [ ]
        - [ ] Tests added
        - [ ] Lint and tests pass
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Related docs
      description: Links to the docs this touches (for example docs/tag-schema.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [tagger, api, cv, data, docs, infra]
    validations:
      required: true
